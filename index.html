<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SZL KHIPU lab</title>
  <style>
    :root { --bg:#07090d; --fg:#e8edf2; --muted:#8b95a3; --accent:#3af4c8; --line:rgba(232,237,242,.12); --surf:#0d1520; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 "Segoe UI",system-ui,sans-serif; }
    header, main { max-width:920px; margin:0 auto; padding:24px 20px; }
    h1 { font-family: Georgia, serif; font-weight:500; letter-spacing:-.03em; }
    .kicker { font:11px/1 ui-monospace,Menlo,monospace; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
    .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
    .card { background:var(--surf); border:1px solid var(--line); border-radius:16px; padding:16px; }
    a { color:var(--accent); }
    input[type=range] { width:100%; accent-color:var(--accent); }
    .mono { font-family: ui-monospace, Menlo, monospace; }
    .muted { color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <header>
    <p class="kicker">SZL Holdings · Knot the run · Hash the proof</p>
    <h1>KHIPU lab</h1>
    <p class="muted">Holographic kernel atlas. Full TanStack app lives on GitHub. This Space boots without npm.</p>
  </header>
  <main>
    <section class="card">
      <h2>Λ playground</h2>
      <p class="muted">Weighted geometric mean. Uniqueness is Conjecture 1.</p>
      <p class="mono" id="lam" style="font-size:28px;color:var(--accent)">—</p>
      <div id="sliders"></div>
    </section>
    <h2>Organs</h2>
    <div class="grid">
      <a class="card" href="https://huggingface.co/spaces/SZLHOLDINGS/szl-khipu">szl-khipu kernels</a>
      <a class="card" href="https://huggingface.co/SZLHOLDINGS/szl-formulas">21 formulas</a>
      <a class="card" href="https://huggingface.co/SZLHOLDINGS/szl-lambda-gate">lambda-gate</a>
      <a class="card" href="https://github.com/szl-holdings/khipu-lab">GitHub source</a>
    </div>
  </main>
  <script>
    const axes = Array(13).fill(0.92); axes[0]=0.97; axes[1]=0.96;
    const box = document.getElementById("sliders");
    function render() {
      box.innerHTML = axes.map((v,i)=>`<label class="muted mono">A${i+1} ${v.toFixed(2)}<input type="range" min="0.5" max="1" step="0.01" value="${v}" data-i="${i}"></label>`).join("");
      box.querySelectorAll("input").forEach(el => el.oninput = (e) => { axes[+e.target.dataset.i] = +e.target.value; ping(); render(); });
    }
    async function ping() {
      const r = await fetch("/api/lambda", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({axes}) });
      const j = await r.json();
      document.getElementById("lam").textContent = (j.lambda ?? 0).toFixed(4) + "  " + (j.decision||"");
    }
    render(); ping();
  </script>
</body>
</html>
